name: Go CI/CD

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src

    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Run vet
        run: go vet ./...

      - name: Run tests
        run: go test -v ./...

      - name: Run benchmarks
        run: go test -bench="." -benchmem -run=^$ ./...

  build:
    needs: test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src

    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum

      - name: Build
        env:
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          go build -ldflags="-s -w" -o dist/velkor ./velkor

      - name: Build Linux packages
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "${GITHUB_REF}" != refs/tags/* ]]; then
            VERSION="0.0.1"
          fi

          nfpm package --config nfpm.yaml --target dist/velkor.deb
          nfpm package --config nfpm.yaml --target dist/velkor.rpm
          nfpm package --config nfpm.yaml --target dist/velkor.apk

      - name: Generate SHA256 checksums
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cd dist
          for file in *; do
            sha256sum "${file}" > "${file}.sha256"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux
          path: src/dist/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/linux/*
