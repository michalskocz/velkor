stages:
  - test
  - build

threads: 4

unit_tests:
  stage: test
  image: golang:1.26
  script:
    - go test -v ./...

benchmarks:
  stage: test
  image: golang:1.26
  script:
    - go test -bench="." -benchmem -run=^$ ./...

build_app:
  stage: build
  image: golang:1.26
  artifacts: ["dist/velkor"]
  script:
    - go build -o dist/velkor  ./exe
    - ./dist/velkor --help
