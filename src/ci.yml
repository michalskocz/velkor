stages:
  - test
  - build

variables:
  - SRC: "./velkor"

threads: 4

unit_tests:
  stage: test
  image: golang:1.26
  script:
    - go mod download
    - go vet ./...
    - go test -v ./...
    - go test -bench="." -benchmem -run=^$ ./...

build_app:
  stage: build
  image: golang:1.26
  artifacts: ["velkor-ci"]
  script:
    - go build -ldflags="-s -w" -o velkor-ci  ${SRC}
